name: Tests

# Runs the test suite on every push to main, without building or publishing anything, so a problem that
# only shows on GitHub's machines is found before a release tag is pushed.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install -r requirements-desktop.txt

      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src;scripts"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PYTHONIOENCODING = "utf-8"
          python scripts/ci_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
