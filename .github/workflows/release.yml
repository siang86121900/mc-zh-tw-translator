name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install -r requirements-desktop.txt

      - name: Confirm release version
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $expected = "v" + (python -c "from mc_zh_tw_translator.updater import VERSION; print(VERSION)")
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Tag $env:GITHUB_REF_NAME does not match $expected" }

      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src;scripts"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PYTHONIOENCODING = "utf-8"
          python -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build EXE and checksums
        run: python scripts/package_desktop.py

      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/MCTranslator.exe
            dist/SHA256SUMS.txt
            dist/build-info.json
