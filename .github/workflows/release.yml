name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install -r requirements-desktop.txt

      - name: Confirm release version
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $expected = "v" + (python -c "from mc_zh_tw_translator.updater import VERSION; print(VERSION)")
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Tag $env:GITHUB_REF_NAME does not match $expected" }

      - name: Require written release notes
        shell: pwsh
        run: |
          $notes = "docs/release-notes/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path $notes) -or (Get-Item $notes).Length -lt 200) { throw "Missing user-facing release notes: $notes" }
          # Updaters up to v0.4.1 show notes as plain text, so markdown symbols would appear literally.
          if (Select-String -Path $notes -Pattern '^\s*#|\*\*|`' -Quiet) { throw "Release notes must stay readable as plain text (no #, ** or backticks): $notes" }

      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src;scripts"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PYTHONIOENCODING = "utf-8"
          python scripts/ci_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build EXE and checksums
        run: python scripts/package_desktop.py

      - name: Publish public GitHub Release
        # Third-party action with write access to releases: pinned to the exact commit of v2.6.2,
        # so a later change to its moving "v2" tag cannot alter what gets published.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          # The in-app updater shows this body to players; auto-generated notes are only a commit link.
          body_path: docs/release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            dist/MCTranslator.exe
            dist/SHA256SUMS.txt
            dist/build-info.json
